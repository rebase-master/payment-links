services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: payment_links
      POSTGRES_PASSWORD: payment_links
      POSTGRES_DB: payment_links
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_links -d payment_links"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
